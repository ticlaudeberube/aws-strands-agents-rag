---
name: CI

"on":
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, type-check, and test
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Ruff lint
        run: uv run ruff check .

      - name: Ruff format check
        run: uv run ruff format --check .

      - name: Type check (mypy)
        run: uv run mypy .

      # No Milvus, Ollama, or API server runs in CI. Service-dependent
      # integration tests skip automatically (see tests/conftest.py), so this
      # verifies the suite stays green without local dependencies.
      - name: Run tests
        run: uv run pytest -m "not slow" --tb=short

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-html
          path: htmlcov/
          if-no-files-found: ignore

  build-lambda:
    name: Build serverless Lambda package (arm64)
    runs-on: ubuntu-latest
    needs: quality

    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Builds the real deployment zip from src/ with the serverless-runtime
      # dependencies (requirements-lambda.txt) as linux/arm64 wheels, so the
      # Converse-API BedrockClient and all src/ changes ship to Lambda. This
      # replaces the placeholder archive the compute module builds for
      # validation. Pass the artifact to Terraform via lambda_package_path /
      # lambda_source_code_hash on apply (see DEPLOYMENT.md Step 2).
      - name: Build Lambda deployment package
        run: infrastructure/lambda/build_lambda_package.sh

      - name: Upload Lambda package artifact
        uses: actions/upload-artifact@v4
        with:
          name: lambda-package
          path: |
            infrastructure/lambda/dist/lambda.zip
            infrastructure/lambda/dist/lambda.zip.sha256
          if-no-files-found: error
