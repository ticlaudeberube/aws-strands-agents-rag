---
# Consolidated local stack for the AgentCore RAG app (OpenSearch engine).
#
# One `docker compose up -d` brings up the whole local app:
#   opensearch  — vector store + Layer 4 semantic cache (rag-kb / rag-cache),
#                 plain HTTP, security plugin disabled (local-only, no TLS/auth)
#   redis       — Layer 2/3 cache (plain TCP, no TLS)
#   dynamodb    — session/analytics store (DynamoDB Local, in-memory)
#   rag-api     — FastAPI app, Local Mode on OpenSearch (Ollama embeddings)
#   react-chatbot — React UI
#
# Ollama runs on the host (http://host.docker.internal:11434) and is NOT
# containerized here. Milvus has been removed — OpenSearch is the sole engine.
name: agentcore-rag

services:
  # OpenSearch — vector store + Layer 4 semantic cache.
  opensearch:
    container_name: agentcore-rag-opensearch
    image: opensearchproject/opensearch:2.17.1
    environment:
      - discovery.type=single-node
      - bootstrap.memory_lock=true
      - "OPENSEARCH_JAVA_OPTS=-Xms512m -Xmx512m"
      - DISABLE_SECURITY_PLUGIN=true
      - DISABLE_INSTALL_DEMO_CONFIG=true
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    ports:
      - "9200:9200"
    volumes:
      - opensearch-data:/usr/share/opensearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9200/_cluster/health || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 60s
    mem_limit: 2g
    networks:
      - rag-network
    restart: unless-stopped

  # Redis — Layer 2/3 distributed cache (local, non-TLS).
  redis:
    container_name: agentcore-rag-redis
    image: redis:7.4-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    mem_limit: 512m
    networks:
      - rag-network
    restart: unless-stopped

  # DynamoDB Local — session + analytics tables (in-memory, port 8001).
  dynamodb:
    container_name: agentcore-rag-dynamodb
    image: amazon/dynamodb-local:2.5.2
    command: ["-jar", "DynamoDBLocal.jar", "-inMemory", "-port", "8001"]
    ports:
      - "8001:8001"
    mem_limit: 512m
    networks:
      - rag-network
    restart: unless-stopped

  # RAG API Server — Local Mode on OpenSearch (Ollama on the host).
  rag-api:
    container_name: agentcore-rag-api
    build:
      context: ..
      dockerfile: docker/Dockerfile
    environment:
      - DEPLOYMENT_MODE=local
      - LOCAL_VECTOR_BACKEND=opensearch
      - OPENSEARCH_LOCAL_HOST=opensearch
      - OPENSEARCH_LOCAL_PORT=9200
      - OLLAMA_HOST=http://host.docker.internal:11434
      - LOG_LEVEL=INFO
      - PYTHONUNBUFFERED=1
      - API_PORT=8000
    ports:
      - "8000:8000"
    volumes:
      # Mount the entrypoint + source so edits don't require an image rebuild.
      - ../api_server.py:/app/api_server.py
      - ../src:/app/src
      - ../chatbots:/app/chatbots
      - ../document_loaders:/app/document_loaders
      - rag-cache:/app/.cache
    depends_on:
      opensearch:
        condition: service_healthy
    mem_limit: 2g
    memswap_limit: 2g
    cpus: 2.0
    init: true
    networks:
      - rag-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # React Chatbot UI.
  react-chatbot:
    container_name: agentcore-rag-react
    build:
      context: ..
      dockerfile: docker/Dockerfile.react
    environment:
      - REACT_APP_API_PORT=8000
      - REACT_APP_API_HOST=host.docker.internal
    ports:
      - "3000:3000"
    depends_on:
      rag-api:
        condition: service_healthy
    mem_limit: 512m
    memswap_limit: 512m
    cpus: 1.0
    init: true
    networks:
      - rag-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

volumes:
  opensearch-data:
    driver: local
  rag-cache:
    driver: local

networks:
  rag-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/16
