[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aws-strands-agents-rag"
version = "0.1.0"
description = "AWS Strands Agents RAG with Ollama and Milvus"
requires-python = ">=3.10"
authors = [
    {name = "Claude Berube", email = "cberube@ipsofactointeractif.ca"}
]
readme = "README.md"
license = {text = "MIT"}

dependencies = [
    "numpy<2.0",
    "strands-agents>=1.27.0",
    "ollama>=0.1.0",
    "pymilvus>=2.4.0",
    "opensearch-py>=2.4.0",
    "boto3>=1.34.0",
    "python-dotenv>=1.0.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "requests>=2.31.0",
    "httpx>=0.25.0",
    "tqdm>=4.65.0",
    "fastapi>=0.100.0",
    "uvicorn>=0.23.0",
    "bleach>=6.3.0",
]

[project.optional-dependencies]
serverless = [
    "boto3>=1.34.0",
    "opensearch-py>=2.4.0",
    "redis>=5.0.0",
    "msgpack>=1.0.0",
]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.1.0",
    "pytest-mock>=3.11.1",
    "pytest-timeout>=2.1.0",
    "pytest-xdist>=3.3.1",
    "hypothesis>=6.100.0",
    "responses>=0.23.1",
    "black>=26.1.0",
    "ruff>=0.15.4",
    "mypy>=1.0.0",
    "types-tqdm>=4.64.0",
    "pre-commit>=3.0.0",
]

[tool.setuptools]
packages = ["src"]

[tool.black]
line-length = 100
target-version = ["py310"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
exclude = []

# Ignore missing type stubs for libraries without types-* packages
[[tool.mypy.overrides]]
module = [
    "bleach",
    "boto3",
    "boto3.*",
    "msgpack",
    "aws_xray_sdk",
    "aws_xray_sdk.*",
]
ignore_missing_imports = true

[dependency-groups]
dev = [
    "black>=26.1.0",
    "mypy>=1.19.1",
    "pytest-cov>=7.0.0",
    "ruff>=0.15.4",
]

[tool.pytest.ini_options]
# Test discovery patterns
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

# Output + coverage options
addopts = [
    "-v",
    "--strict-markers",
    "--tb=short",
    "--disable-warnings",
    "-p", "no:warnings",
    "--cov=src",
    "--cov-report=html",
]

# Test paths
testpaths = ["tests"]

# Markers for test categorization
markers = [
    "unit: Unit tests",
    "integration: Integration tests",
    "async: Async tests",
    "slow: Slow running tests",
    "health: Health check tests",
    "requires_milvus: Tests requiring a reachable Milvus server (auto-skipped when unavailable)",
]

[tool.coverage.run]
source = ["src"]
omit = [
    "*/tests/*",
    "*/__init__.py",
    "*/config/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]
